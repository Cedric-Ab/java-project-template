name: Clean Code violation
description: Report a clean code violation or a needed cleanup in general
title: "[CLEAN CODE] "
labels: [ "clean-code" ]
body:
  - type: input
    id: files
    attributes:
      label: Affected Files
      description: Where is this violation?
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be changed?
    validations:
      required: true
